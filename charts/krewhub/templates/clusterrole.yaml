{{- if .Values.krewhubCentral.rbac.create }}
# RBAC mínimo -- só os recursos que
# app/k8s_manager.py/app/k8s_templates.py (código-fonte do
# krewhub-central) de fato manipulam hoje, não uma lista aspiracional.
# ClusterRole (não Role) porque
# `devNamespace.name` é configurável -- não escopamos um Role fixo pra
# um nome de namespace específico.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Nome fixo (não sufixado por release) -- ClusterRole é cluster-scoped;
  # instalar duas releases deste chart no mesmo cluster colidiria aqui de
  # propósito (só deveria existir um krewhub-central por cluster hoje).
  name: krewhub-central
  labels:
    {{- include "krewhub.labels" . | nindent 4 }}
rules:
  # Namespace compartilhado de dev -- só leitura/confirmação
  # (k8s_manager.ensure_dev_namespace faz um read_namespace; ele já
  # existe via o template dev-namespace.yaml deste chart). SEM
  # create/patch/update -- não é mais necessário (mesmo achado já
  # documentado no GitOps).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Secret (kiro-owner-id-<slug>) e PVC (kiro-workspace-<slug>): SEM
  # "delete" de proposito -- teardown_dev_workload nunca apaga nenhum
  # dos dois (preserva workspace/identidade do dev entre /close e
  # reprovisionamento). Mesma garantia ja documentada no GitOps do
  # homelab, reforcada aqui em profundidade pelo proprio RBAC.
  - apiGroups: [""]
    resources: ["secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  # ConfigMap (kiro-config-<slug>) e Service (kirocrew-<slug>): "delete"
  # necessario -- teardown_dev_workload apaga os dois no /close e
  # /logout (achado ao vivo nesta fatia: este chart empacotado tinha
  # ficado pra tras da mesma correcao ja aplicada nos manifests brutos
  # do homelab -- sem isso, /close/logout devolvia 403 ao tentar deletar
  # o Service do dev).
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # Pods -- o workload por-dev em si (Pod `kirocrew-<slug>`, migrado de
  # Deployment nesta fatia -- ver docs/ARCHITECTURE.md, seção "Pure Pod
  # instead of Deployment for the per-dev workload"): get/list/watch pra achar/ler status (inclui o
  # pod do CHP por label selector), create/patch/update pro reconcile
  # (k8s_manager.ensure_pod), delete porque teardown_dev_workload apaga
  # o Pod no /close e /logout (mesma lógica que antes se aplicava ao
  # Deployment). k8s_manager.wait_for_ready lê o Pod via
  # `read_namespaced_pod` (não `read_namespaced_pod_status`) DE PROPÓSITO
  # -- assim não precisa de uma regra nova pro subrecurso `pods/status`.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # get, não create: o client python (connect_get_namespaced_pod_exec)
  # emite a requisição como HTTP GET com upgrade pra websocket -- o
  # apiserver checa RBAC contra o verbo HTTP real, não contra a
  # convenção usual de "create" documentada pro kubectl exec (achado ao
  # vivo, documentado em docs/ARCHITECTURE.md, seção "RBAC: a
  # non-obvious verb").
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  # NetworkPolicy (allow-chp-to-dashboard-only-<slug>, uma por dev, com
  # podSelector único -- crítico com o namespace compartilhado).
  # "delete" adicionado -- teardown_dev_workload apaga a NetworkPolicy
  # allow-chp-to-dashboard-only-<slug> no /close e /logout (mesmo achado
  # do bloco acima).
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
{{- end }}
