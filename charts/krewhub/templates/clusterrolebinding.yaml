{{- if .Values.krewhubCentral.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: krewhub-central
  labels:
    {{- include "krewhub.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "krewhubCentral.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: krewhub-central
  apiGroup: rbac.authorization.k8s.io
{{- end }}
