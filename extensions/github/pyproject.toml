[project]
name = "krewhub-ext-github"
version = "0.1.0"
description = "KrewHub extension: git over HTTPS in the dev Pod with a GitHub token"
requires-python = ">=3.12"
# Sem dependência de `krewhub`: o módulo `app.extensions.base` vem do
# processo hospedeiro (ver docs/EXTENSIONS.md).
dependencies = []

[project.entry-points."krewhub.extensions"]
github = "krewhub_ext_github:GithubExtension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krewhub_ext_github"]
