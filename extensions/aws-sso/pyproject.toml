[project]
name = "krewhub-ext-aws-sso"
version = "0.1.0"
description = "KrewHub extension: AWS IAM Identity Center credentials for the dev Pod via aws-sso-cli"
requires-python = ">=3.12"
# Sem dependência de `krewhub`: o módulo `app.extensions.base` vem do
# processo hospedeiro (ver docs/EXTENSIONS.md).
dependencies = []

[project.entry-points."krewhub.extensions"]
aws-sso = "krewhub_ext_aws_sso:AwsSsoExtension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krewhub_ext_aws_sso"]
